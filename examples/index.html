<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Theme: Void Industrial */
        --c-void: #030303;
        --c-surface: #0a0a0a;
        --c-surface-hover: #141414;
        --c-border: #333333;
        --c-border-active: #666666;

        /* Accents */
        --c-acid: #ccff00; /* Primary Action */
        --c-acid-dim: #4d6600;
        --c-signal: #ff3300; /* Error/Cancel */
        --c-process: #00f0ff; /* Info/Processing */

        /* Text */
        --c-text-main: #eeeeee;
        --c-text-muted: #888888;

        /* Typography */
        --f-display: 'Space Grotesk', sans-serif;
        --f-mono: 'JetBrains Mono', monospace;

        /* Dimensions */
        --scanline-gap: 4px;
      }

      * {
        box-sizing: border-box;
        cursor: default; /* Custom cursor feel */
      }

      body {
        background-color: var(--c-void);
        background-image: linear-gradient(var(--c-border) 1px, transparent 1px),
          linear-gradient(90deg, var(--c-border) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: center top;
        color: var(--c-text-main);
        font-family: var(--f-display);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Vignette & Noise Overlay */
      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at center,
          transparent 0%,
          #000 120%
        );
        pointer-events: none;
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 800px;
        padding: 2rem;
      }

      /* Header Section */
      header {
        margin-bottom: 3rem;
        border-left: 2px solid var(--c-acid);
        padding-left: 1.5rem;
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header::before {
        content: '';
        position: absolute;
        top: -20px;
        left: 0;
        font-family: var(--f-mono);
        font-size: 0.75rem;
        color: var(--c-acid);
        opacity: 0.7;
      }

      h1 {
        font-family: var(--f-display);
        font-weight: 300;
        font-size: 3rem;
        text-transform: uppercase;
        letter-spacing: -0.04em;
        margin: 0;
        line-height: 1;
      }

      h1 span {
        font-weight: 700;
        color: var(--c-acid);
      }

      /* GitHub Link */
      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--c-border);
        background: var(--c-surface);
        color: var(--c-text-muted);
        text-decoration: none;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .github-link:hover {
        border-color: var(--c-acid);
        color: var(--c-acid);
        background: var(--c-surface-hover);
        box-shadow: 0 0 10px rgba(204, 255, 0, 0.2);
        transform: translateY(-2px);
        cursor: pointer;
      }

      .github-link:active {
        transform: translateY(0);
      }

      .github-link svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      /* Upload Zone */
      .upload-section {
        background: rgba(10, 10, 10, 0.8);
        border: 1px solid var(--c-border);
        backdrop-filter: blur(5px);
        padding: 2px; /* For inner border effect */
        position: relative;
        transition: border-color 0.3s ease;
      }

      .upload-section:hover {
        border-color: var(--c-border-active);
      }

      /* Decorative Corners */
      .corner {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 1px solid var(--c-acid);
        transition: all 0.3s ease;
        opacity: 0.5;
      }
      .upload-section:hover .corner {
        opacity: 1;
        width: 20px;
        height: 20px;
      }
      .tl {
        top: -1px;
        left: -1px;
        border-bottom: none;
        border-right: none;
      }
      .tr {
        top: -1px;
        right: -1px;
        border-bottom: none;
        border-left: none;
      }
      .bl {
        bottom: -1px;
        left: -1px;
        border-top: none;
        border-right: none;
      }
      .br {
        bottom: -1px;
        right: -1px;
        border-top: none;
        border-left: none;
      }

      .upload-inner {
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0.02) 4px
        );
        padding: 3rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .upload-label {
        font-family: var(--f-mono);
        color: var(--c-text-muted);
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 1rem;
        display: block;
      }

      /* Custom File Input Styling */
      .file-input-wrapper {
        position: relative;
        display: inline-block;
        width: 100%;
        margin-bottom: 2rem;
      }

      input[type='file'] {
        width: 100%;
        padding: 1rem;
        background: var(--c-surface);
        border: 1px dashed var(--c-border-active);
        color: var(--c-text-main);
        font-family: var(--f-mono);
        font-size: 0.85rem;
        transition: all 0.2s;
      }

      input[type='file']:hover {
        border-color: var(--c-acid);
        background: var(--c-surface-hover);
        cursor: pointer;
      }

      /* Buttons */
      .actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        border-top: 1px solid var(--c-border);
        padding-top: 1.5rem;
      }

      button {
        font-family: var(--f-mono);
        font-size: 0.8rem;
        text-transform: uppercase;
        font-weight: 500;
        letter-spacing: 0.05em;
        padding: 1rem 2rem;
        border: 1px solid transparent;
        transition: all 0.1s;
        position: relative;
        overflow: hidden;
      }

      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        filter: grayscale(1);
      }

      #uploadButton {
        background: var(--c-acid);
        color: black;
        font-weight: 700;
      }

      #uploadButton:hover:not(:disabled) {
        background: #eaff00;
        box-shadow: 0 0 15px rgba(204, 255, 0, 0.3);
        transform: translateY(-1px);
      }

      #uploadButton:active:not(:disabled) {
        transform: translateY(1px);
      }

      #cancelButton {
        background: transparent;
        border: 1px solid var(--c-border);
        color: var(--c-text-muted);
      }

      #cancelButton:hover:not(:disabled) {
        border-color: var(--c-signal);
        color: var(--c-signal);
      }

      /* Progress Bar */
      .progress-container {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        position: relative;
      }

      .progress-fill {
        height: 100%;
        background: var(--c-acid);
        width: 0%;
        transition: width 0.1s linear;
        box-shadow: 0 0 10px var(--c-acid);
      }

      #progressText {
        font-family: var(--f-mono);
        font-size: 0.75rem;
        text-align: right;
        color: var(--c-acid);
      }

      /* Status Messages */
      .message-box {
        margin-top: 1rem;
        padding: 1rem;
        font-family: var(--f-mono);
        font-size: 0.8rem;
        border-left: 3px solid;
        background: rgba(0, 0, 0, 0.3);
      }

      .error-message {
        border-color: var(--c-signal);
        color: var(--c-signal);
        animation: glitch 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both
          infinite;
      }

      .success-message {
        border-color: var(--c-process);
        color: var(--c-process);
      }

      /* File List */
      .file-list {
        margin-top: 3rem;
      }

      .file-list h3 {
        font-family: var(--f-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--c-text-muted);
        border-bottom: 1px solid var(--c-border);
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
      }

      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        margin-bottom: 0.5rem;
        font-family: var(--f-mono);
        font-size: 0.85rem;
        transition: transform 0.2s;
      }

      .file-item:hover {
        border-color: var(--c-text-muted);
        transform: translateX(4px);
      }

      .file-info strong {
        display: block;
        color: var(--c-text-main);
        font-weight: 400;
      }

      .file-info div {
        font-size: 0.75rem;
        color: var(--c-text-muted);
        margin-top: 4px;
      }

      .status-badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        text-transform: uppercase;
        border: 1px solid currentColor;
      }

      .status-pending {
        color: var(--c-text-muted);
      }
      .status-uploading {
        color: var(--c-process);
        animation: blink 1s infinite;
      }
      .status-success {
        color: var(--c-acid);
        background: var(--c-acid-dim);
        border: none;
      }
      .status-error {
        color: var(--c-signal);
      }

      /* Animations */
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @keyframes glitch {
        0% {
          transform: translate(0);
        }
        20% {
          transform: translate(-2px, 2px);
        }
        40% {
          transform: translate(-2px, -2px);
        }
        60% {
          transform: translate(2px, 2px);
        }
        80% {
          transform: translate(2px, -2px);
        }
        100% {
          transform: translate(0);
        }
      }

      @media (max-width: 600px) {
        .container {
          padding: 1rem;
        }
        h1 {
          font-size: 2rem;
        }
        .actions {
          flex-direction: column;
        }
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>WL Upload</h1>
        <a
          href="https://github.com/warmeaf/wl-upload"
          target="_blank"
          rel="noopener noreferrer"
          class="github-link"
          aria-label="View on GitHub"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
            />
          </svg>
        </a>
      </header>

      <div class="upload-section">
        <!-- Decorative Corners -->
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="upload-inner">
          <label class="upload-label">Select Files</label>

          <div class="file-input-wrapper">
            <input type="file" id="fileInput" multiple />
          </div>

          <div class="actions">
            <button id="cancelButton" disabled>Abort</button>
            <button id="uploadButton">Initiate Upload</button>
          </div>

          <div class="progress-container">
            <div id="progressText">00%</div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div
            id="errorMessage"
            class="message-box error-message"
            style="display: none"
          ></div>
          <div
            id="successMessage"
            class="message-box success-message"
            style="display: none"
          ></div>
        </div>
      </div>

      <div class="file-list" id="fileList">
        <!-- JS populates this -->
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

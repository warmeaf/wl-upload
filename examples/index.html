<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WL Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Crimson+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Base Colors */
        --c-sand: #F5F1EB;
        --c-sand-dark: #E8E3DA;
        --c-clay: #D4C5B0;
        --c-moss: #4A5D4F;
        --c-moss-light: #6B8270;
        --c-moss-dark: #354439;
        --c-stone: #8B8178;
        --c-stone-dark: #5C554F;
        --c-earth: #A69B91;
        --c-fail: #B85C5C;
        --c-fail-bg: #F2E6E6;
        --c-bloom: #7B9B6A;
        --c-bloom-bg: #EDF2E9;
        --c-river: #7B9EAC;
        --c-bark: #3D3329;
        --c-parchment: #FAF7F2;

        /* Typography */
        --f-display: 'Cormorant Garamond', serif;
        --f-body: 'Crimson Text', serif;
        --f-mono: 'IBM Plex Mono', monospace;

        /* Spacing */
        --space-xs: 0.5rem;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
        --space-xl: 3rem;

        /* Border Radius */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-pill: 50px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--c-sand);
        background-image:
          radial-gradient(ellipse 150% 100% at 20% 30%, rgba(107, 130, 112, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse 120% 80% at 80% 70%, rgba(166, 155, 145, 0.12) 0%, transparent 50%);
        color: var(--c-stone-dark);
        font-family: var(--f-body);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
      }

      /* Floating organic shapes */
      body::before {
        content: '';
        position: fixed;
        top: -50%;
        right: -20%;
        width: 80%;
        height: 150%;
        background: radial-gradient(ellipse, rgba(107, 130, 112, 0.06) 0%, transparent 70%);
        border-radius: 60% 40% 30% 70%;
        animation: float 20s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      body::after {
        content: '';
        position: fixed;
        bottom: -30%;
        left: -10%;
        width: 60%;
        height: 120%;
        background: radial-gradient(ellipse, rgba(166, 155, 145, 0.08) 0%, transparent 70%);
        border-radius: 40% 60% 70% 30%;
        animation: float 25s ease-in-out infinite reverse;
        pointer-events: none;
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 800px;
        padding: 2rem;
      }

      /* Header Section */
      header {
        margin-bottom: 3rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        position: relative;
      }

      header::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 0;
        width: 120px;
        height: 3px;
        background: linear-gradient(90deg, var(--c-moss), transparent);
        border-radius: 3px;
      }

      h1 {
        font-family: var(--f-display);
        font-weight: 300;
        font-size: 3.5rem;
        font-style: italic;
        color: var(--c-bark);
        letter-spacing: -0.02em;
        margin: 0;
        line-height: 1;
      }

      /* GitHub Link */
      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--c-parchment);
        border: 1px solid var(--c-clay);
        color: var(--c-stone);
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(61, 51, 41, 0.08);
      }

      .github-link:hover {
        border-color: var(--c-moss);
        color: var(--c-moss);
        background: var(--c-sand);
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 6px 20px rgba(74, 93, 79, 0.2);
        cursor: pointer;
      }

      .github-link:active {
        transform: translateY(-1px) scale(1);
      }

      .github-link svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      /* Upload Zone */
      .upload-section {
        background: var(--c-parchment);
        border: 1px solid var(--c-clay);
        box-shadow:
          0 4px 20px rgba(61, 51, 41, 0.06),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        backdrop-filter: blur(10px);
        padding: 4px;
        position: relative;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border-radius: 24px 16px 20px 18px;
      }

      .upload-section:hover {
        transform: translateY(-4px);
        box-shadow:
          0 12px 40px rgba(61, 51, 41, 0.1),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      }

      .upload-inner {
        background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 100%);
        border-radius: 20px 18px 22px 16px;
        padding: 3rem 2.5rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .upload-label {
        font-family: var(--f-display);
        color: var(--c-stone);
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        margin-bottom: 1.5rem;
        display: block;
        font-style: italic;
      }

      /* Custom File Input Styling */
      .file-input-wrapper {
        position: relative;
        display: inline-block;
        width: 100%;
        margin-bottom: 2.5rem;
      }

      input[type='file'] {
        width: 100%;
        padding: 1.5rem;
        background: var(--c-sand);
        border: 2px dashed var(--c-clay);
        color: var(--c-stone-dark);
        font-family: var(--f-body);
        font-size: 0.95rem;
        border-radius: var(--radius-lg);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      input[type='file']:hover {
        border-color: var(--c-moss);
        background: var(--c-sand-dark);
        box-shadow: 0 0 0 4px rgba(107, 130, 112, 0.1);
      }

      input[type='file']:focus {
        outline: none;
        border-color: var(--c-moss);
        box-shadow: 0 0 0 4px rgba(107, 130, 112, 0.15);
      }

      /* Buttons */
      .actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        border-top: 1px solid var(--c-clay);
        padding-top: 2rem;
      }

      button {
        font-family: var(--f-display);
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        padding: 1rem 2rem;
        border: none;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none !important;
      }

      #uploadButton {
        background: linear-gradient(135deg, var(--c-moss), var(--c-moss-dark));
        color: var(--c-sand);
        border-radius: var(--radius-pill);
        box-shadow: 0 4px 15px rgba(74, 93, 79, 0.2);
      }

      #uploadButton:hover:not(:disabled) {
        background: linear-gradient(135deg, var(--c-moss-light), var(--c-moss));
        box-shadow: 0 6px 20px rgba(74, 93, 79, 0.3);
        transform: translateY(-2px) scale(1.02);
      }

      #uploadButton:active:not(:disabled) {
        transform: translateY(0) scale(0.98);
      }

      #cancelButton {
        background: transparent;
        border: 1px solid var(--c-clay);
        color: var(--c-stone-dark);
        border-radius: var(--radius-pill);
      }

      #cancelButton:hover:not(:disabled) {
        border-color: var(--c-fail);
        color: var(--c-fail);
        background: rgba(184, 92, 92, 0.08);
      }

      /* Progress Bar */
      .progress-container {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--c-sand-dark);
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--c-clay);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--c-moss), var(--c-moss-light));
        width: 0%;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 10px;
        position: relative;
      }

      .progress-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      #progressText {
        font-family: var(--f-mono);
        font-size: 0.85rem;
        font-weight: 300;
        text-align: right;
        color: var(--c-moss);
        letter-spacing: 0.05em;
      }

      /* Status Messages */
      .message-box {
        margin-top: 1.5rem;
        padding: 1.25rem 1.5rem;
        font-family: var(--f-body);
        font-size: 0.95rem;
        border-radius: var(--radius-md);
        line-height: 1.6;
      }

      .error-message {
        background: var(--c-fail-bg);
        color: var(--c-fail);
        border-left: 4px solid var(--c-fail);
      }

      .success-message {
        background: var(--c-bloom-bg);
        color: var(--c-bloom);
        border-left: 4px solid var(--c-bloom);
      }

      /* File List */
      .file-list {
        margin-top: 2.5rem;
      }

      .file-list h3 {
        font-family: var(--f-display);
        font-weight: 400;
        font-size: 1.25rem;
        color: var(--c-stone);
        border-bottom: 2px solid var(--c-clay);
        padding-bottom: 0.75rem;
        margin-bottom: 1.5rem;
        letter-spacing: 0.02em;
      }

      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.25rem 1.5rem;
        background: var(--c-parchment);
        border: 1px solid var(--c-clay);
        border-radius: 12px 16px 12px 16px;
        margin-bottom: 1rem;
        font-family: var(--f-body);
        font-size: 0.95rem;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(61, 51, 41, 0.04);
      }

      .file-item:hover {
        border-color: var(--c-stone);
        transform: translateX(4px);
        box-shadow: 0 4px 12px rgba(61, 51, 41, 0.08);
      }

      .file-info strong {
        display: block;
        color: var(--c-bark);
        font-weight: 500;
        font-family: var(--f-display);
        font-size: 1.05rem;
      }

      .file-info div {
        font-size: 0.85rem;
        color: var(--c-earth);
        margin-top: 0.4rem;
        font-family: var(--f-mono);
      }

      .status-badge {
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.4rem 1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-radius: var(--radius-pill);
        font-family: var(--f-mono);
      }

      .status-pending {
        background: var(--c-sand-dark);
        color: var(--c-stone);
      }
      .status-uploading {
        background: rgba(123, 158, 172, 0.15);
        color: var(--c-river);
        animation: breathe 2s ease-in-out infinite;
      }
      .status-success {
        background: var(--c-bloom-bg);
        color: var(--c-bloom);
        border: 1px solid var(--c-bloom);
      }
      .status-error {
        background: var(--c-fail-bg);
        color: var(--c-fail);
        border: 1px solid var(--c-fail);
      }

      /* Animations */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(2deg);
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @media (max-width: 600px) {
        .container {
          padding: 1.5rem;
        }
        h1 {
          font-size: 2.2rem;
        }
        .actions {
          flex-direction: column-reverse;
          gap: 0.75rem;
        }
        button {
          width: 100%;
        }
        .upload-inner {
          padding: 2rem 1.5rem;
        }
        .file-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 1rem;
        }
        .status-badge {
          align-self: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>WL Upload</h1>
        <a
          href="https://github.com/warmeaf/wl-upload"
          target="_blank"
          rel="noopener noreferrer"
          class="github-link"
          aria-label="View on GitHub"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
            />
          </svg>
        </a>
      </header>

      <div class="upload-section">
        <div class="upload-inner">
          <label class="upload-label">Select Files</label>

          <div class="file-input-wrapper">
            <input type="file" id="fileInput" multiple />
          </div>

          <div class="actions">
            <button id="cancelButton" disabled>Abort</button>
            <button id="uploadButton">Upload</button>
          </div>

          <div class="progress-container">
            <div id="progressText">00%</div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div
            id="errorMessage"
            class="message-box error-message"
            style="display: none"
          ></div>
          <div
            id="successMessage"
            class="message-box success-message"
            style="display: none"
          ></div>
        </div>
      </div>

      <div class="file-list" id="fileList">
        <!-- JS populates this -->
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
